name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTDOCFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  # Change to specific Rust release to pin or `stable` for the latest stable version.
  rust_stable: 1.97.1
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  GH_DEPLOY_KEY: ${{ secrets.GH_DEPLOY_KEY }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_LOG: error

jobs:
  build:
    if: github.event_name == 'push'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 'node-cleanup'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
          targets: x86_64-unknown-linux-gnu
      - name: Install Target
        run: rustup target add x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          # Install build dependencies. Some runners lack IPv6 egress while
          # DNS returns AAAA records, so force IPv4 and retry — apt mirror
          # flakiness otherwise fails the job before the build starts.
          APT="-o Acquire::ForceIPv4=true"
          for attempt in 1 2 3; do
            sudo apt-get $APT update && \
              sudo apt-get $APT install -y cmake clang pkg-config libssl-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" && sleep 15
          done
          command -v cmake >/dev/null || { echo "build dependencies missing after retries"; exit 1; }
          RUSTFLAGS="-D warnings" cargo build --bin ika --target x86_64-unknown-linux-gnu

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Fmt Check
        run: cargo fmt -- --check
      - name: Fmt Check - Wasm
        run: cargo fmt -- --check
        working-directory: sdk/ika-wasm
      - name: Metric name convention
        # New prometheus metrics must use the ika_ prefix; the legacy set
        # is frozen in scripts/metric-name-allowlist.txt.
        # See dev-docs/conventions/metrics.md.
        run: ./scripts/check-metric-names.sh
      - name: Workspace membership
        # Every crate must be built by the workspace or explicitly excluded;
        # a crate in neither is never compiled and rots invisibly.
        run: ./scripts/check-workspace-manifests.sh
      - name: Epoch-table write discipline
        # Every AuthorityEpochTables field must declare whether it is
        # commit-batched or written directly (and why that is safe).
        # See dev-docs/conventions/epoch-table-write-discipline.md.
        run: ./scripts/check-epoch-table-write-discipline.sh
      - name: Invariant violation metric coverage
        # Every should-never-happen log must increment the fleet-visible
        # invariant violation counter through the shared macro.
        run: ./scripts/check-invariant-violation-markers.sh
      - name: Chain-mirror layout
        # The Move structs that Rust mirrors with UNTAGGED structs may not
        # change shape without the Rust mirror and the version dispatch moving
        # in the same PR: BCS is positional, so their field order is the wire
        # format of bytes already on chain, and no OCS proof gate verifies shape.
        # See dev-docs/conventions/chain-mirror-layout.md.
        run: ./scripts/check-chain-mirror-layout.sh
      - name: Sui version consistency
        # The Sui pin lives in several places that don't update together;
        # see dev-docs/conventions/sui-version-bump.md.
        run: ./scripts/check-sui-version-consistency.sh

      - name: Workspace version consistency (standalone lockfiles)
        # Standalone lockfiles (sdk/ika-wasm) pin root-workspace crates and
        # don't update with the root lock: the v1.2.2 bump missed the wasm
        # lock, breaking --locked SDK builds. Red PR instead of a
        # post-release discovery.
        run: ./scripts/check-workspace-version-consistency.sh

  # Runs on PRs AND pushes: clippy used to be push-to-main-only, which let a
  # workspace-wide lint backlog accumulate invisibly (PRs merged unlinted and
  # only the FIRST failing crate ever surfaced on main).
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # The msim compilation universe (`--cfg msim` + msim-patched tokio and the
  # `[target.'cfg(msim)']` deps) is invisible to the regular clippy job above;
  # without this pass, simtest-only code only fails at the next (manual or
  # nightly) simtest run. `cargo simtest clippy` is the shim's clippy mode.
  clippy-simtest:
    name: Clippy (msim / simtest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # msim artifacts don't overlap with the normal CI cache (same
          # prefix as the simtest workflow, which shares the dep graph).
          prefix-key: "simtest"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.86.2
        with:
          tool: cargo-nextest
      - name: Install cargo-simtest shim
        run: ./scripts/simtest/install.sh
      - name: Run Clippy under msim
        run: cargo simtest clippy --all-targets --all-features -- -D warnings

  cargo-check:
    name: Cargo Test Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
          targets: x86_64-unknown-linux-gnu
      - name: Install Target
        run: rustup target add x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (ika-core tests)
        run: cargo check -p ika-core --features test-utils --tests --target x86_64-unknown-linux-gnu
