name: Simtest

# Manually triggered. Runs the deterministic msim test suite (every
# #[sim_test] in the workspace — single-OS-thread simulation with the
# dwallet-mpc-unsafe-mock crypto, so a seed reproduces a run exactly).
# On the large runner the full suite is ~25-35 minutes wall; dispatch it
# for any change touching dwallet_mpc, sui_connector, or epoch/session
# lifecycle. Background on the msim patches and gotchas:
# dev-docs/conventions/simtest.md.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Cargo package to test"
        type: string
        required: false
        default: "ika-test-cluster"
      test_filter:
        description: "Test name filter passed to nextest"
        type: string
        required: false
        # All #[sim_test] targets share the sim_ prefix; plain #[tokio::test]
        # functions are ignored under the sim runner, so this default runs
        # exactly the fault-simulation suite. For a seed sweep, raise
        # test_num (MSIM_TEST_NUM iterates seeds starting from `seed`).
        default: "sim_"
      seed:
        description: "MSIM_TEST_SEED"
        type: string
        required: false
        default: "1"
      test_num:
        description: "MSIM_TEST_NUM (number of seeds to iterate, starting from seed)"
        type: string
        required: false
        default: "1"
      rust_log:
        description: "RUST_LOG for the simulation"
        type: string
        required: false
        # Info by default: every close-stall investigation needs the
        # per-condition gate breakdown and session lifecycle lines, and a
        # failed gate run at error level cannot be diagnosed without a
        # full re-run. CI log volume at info is acceptable for test runs.
        default: "warn,ika=info,ika_node=info"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  RUST_LOG: ${{ inputs.rust_log }}
  # The simtest watchdog treats CPU-bound stretches as deadlocks
  # (simulated time stops advancing while a worker crunches). Disable so
  # a heavy computation isn't killed mid-flight.
  MSIM_DISABLE_WATCHDOG: "1"
  # Virtual-time budget per #[sim_test]: fault tests deliberately include
  # long sub-quorum windows and slow recovery tails; virtual seconds cost
  # ~nothing in wall time.
  SUI_SIM_TEST_TIMEOUT_SECS: "3600"
  rust_stable: "1.97.1"

jobs:
  simtest:
    name: cargo simtest
    # Self-hosted large runner (same as the integration/TS suites): each
    # #[sim_test] is a single-OS-thread process, and nextest runs one per
    # core — the whole suite runs simultaneously here, whereas the 4-vCPU
    # hosted runner ran it in waves and died mid-suite once the suite grew
    # ("runner lost communication ... starves it for CPU/Memory").
    runs-on: ika-k8s-large
    # Headroom over the ~25-35 minute normal suite: a genuine liveness
    # wedge in a test burns wall clock slowly toward its virtual-time
    # budget, and the run should fail on the test's own evidence rather
    # than be killed silently here.
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          deploy-key: ${{ secrets.GH_DEPLOY_KEY }}

      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}

      - name: Install build dependencies
        run: |
          # IPv4 + retry: some runner pods lack IPv6 egress while DNS returns
          # AAAA records; apt mirror flakiness otherwise fails the job. The
          # k8s pods run as root without sudo, hence the guard.
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          APT="-o Acquire::ForceIPv4=true"
          for attempt in 1 2 3; do
            $SUDO apt-get $APT update && \
              $SUDO apt-get $APT install -y cmake clang pkg-config libssl-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" && sleep 15
          done
          command -v cmake >/dev/null || { echo "build dependencies missing after retries"; exit 1; }

      - uses: Swatinem/rust-cache@v2
        with:
          # Simtest builds use the `simulator` cargo profile and `--cfg msim`,
          # so the artifacts don't overlap with the normal CI cache.
          prefix-key: "simtest"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.86.7
        with:
          tool: cargo-nextest

      - name: Install cargo-simtest shim
        run: ./scripts/simtest/install.sh

      - name: Run simtest
        env:
          MSIM_TEST_SEED: ${{ inputs.seed }}
          MSIM_TEST_NUM: ${{ inputs.test_num }}
          # The fault-matrix sim tests run real class-groups crypto whose
          # synchronous steps can exceed msim's 5s no-progress watchdog;
          # 60s matches scripts/simtest/codecov.sh. Without it every test
          # aborts with "deadlock detected" while progressing normally.
          MSIM_WATCHDOG_TIMEOUT_MS: "60000"
        run: |
          # --no-tests=pass is a nextest option, so it must come BEFORE the
          # `--` separator: the workspace currently has zero #[sim_test]
          # targets by convention, and without it nextest exits 4
          # ("no tests to run") on every dispatch.
          cargo simtest --package ${{ inputs.package }} --no-tests=pass -- ${{ inputs.test_filter }}
