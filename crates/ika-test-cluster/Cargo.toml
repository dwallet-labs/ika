[package]
name = "ika-test-cluster"
version.workspace = true
authors = ["Mysten Labs <build@mystenlabs.com>"]
license = "BSD-3-Clause-Clear"
publish = false
edition = "2024"

[features]
# No default features: the INSECURE `dwallet-mpc-unsafe-mock` below must be opt-in only.
default = []
# INSECURE test-only mock: forwards to the deterministic inkrypto protocol mocks so
# dwallet-mpc integration tests run without real class-group crypto. Never enable in production.
# Run e.g. `cargo test -p ika-test-cluster --features dwallet-mpc-unsafe-mock`.
dwallet-mpc-unsafe-mock = [
    "ika-node/dwallet-mpc-unsafe-mock",
    "dwallet-mpc-centralized-party/dwallet-mpc-unsafe-mock",
]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bcs.workspace = true
cargo_metadata = "0.23"
fastcrypto.workspace = true
futures.workspace = true
hex.workspace = true
serde_json.workspace = true
base64.workspace = true
rand = "0.8"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true

dwallet-mpc-centralized-party.workspace = true
ika-config.workspace = true
ika-node = { path = "../ika-node", default-features = false }
ika-protocol-config.workspace = true
ika-sui-client.workspace = true
ika-swarm.workspace = true
ika-swarm-config.workspace = true
ika-types.workspace = true

sui-keys.workspace = true
sui-swarm-config.workspace = true
sui-types.workspace = true
test-cluster.workspace = true

[target.'cfg(msim)'.dependencies]
sui-simulator.workspace = true

[dev-dependencies]
# Self-dependency so the cluster tests ALWAYS run with the insecure deterministic
# protocol mocks — real class-group MPC makes these tests prohibitively slow.
# Scoped to dev-dependencies: a plain `cargo build` of this crate or of ika-node
# binaries never activates the mock.
ika-test-cluster = { path = ".", features = ["dwallet-mpc-unsafe-mock"] }
# Required by the `#[sim_test]` macro expansion (sui-proc-macros
# init_static_initializers), which references these crates under the msim cfg.
prometheus.workspace = true
sui-macros.workspace = true
sui-protocol-config.workspace = true
telemetry-subscribers.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

# `#[sim_test]` expands (under cfg(msim)) to sui-macros' `init_static_initializers`,
# whose generated static-init thread references `sui_protocol_config` and
# `prometheus` directly (everything else it uses is re-exported through
# `sui-simulator`). They must be linkable deps of the test crate or the msim
# build of these tests fails: `unresolved import sui_protocol_config` /
# `unlinked crate prometheus`.
[target.'cfg(msim)'.dev-dependencies]
sui-protocol-config.workspace = true
prometheus.workspace = true
