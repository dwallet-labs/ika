# CLI-ready default pricing for `ika protocol set-supported-and-pricing`.
#
# Amounts are base units:
# - fee_ika: INKU (1 IKA = 1_000_000_000 INKU)
# - SUI reimbursements: MIST (1 SUI = 1_000_000_000 MIST)
#
# The IKA schedule is 100x the 2026-08-26 mainnet/testnet schedule.
# Every user session funds 0.005 SUI for the shared network/system-call
# reimbursement pool used for network-key reconfiguration.
#
# Notifier reimbursement is based on net transaction cost after storage rebates.
# Measured DKG and sign calls are net-negative. Other session-closing calls are
# also set to zero on the assumption that their released storage covers the cost;
# production examples should be checked when they become available.
# Presign retains new on-chain data and therefore has a positive reimbursement:
# - 0.015 SUI for ECDSA curves (measured on secp256k1; inferred for secp256r1).
# - 0.003 SUI for Schnorr-style curves/algorithms (measured on Curve25519;
#   inferred for Taproot and Ristretto).
#
# Protocols:
# 2=re-encrypt, 3=make share public, 4=imported-key verification,
# 5=presign, 6=sign, 7=future sign, 8=sign with partial user signature,
# 9=dWallet DKG, 10=dWallet DKG with sign.

# secp256k1; signature algorithm 0=ECDSA, 1=Taproot.
- key:
    curve: 0
    signature_algorithm: null
    protocol: 2
  value:
    fee_ika: 2000000000
    gas_fee_reimbursement_sui: 0
    gas_fee_reimbursement_sui_for_system_calls: 5000000
