<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #F6F7F5;
  --ink: #1D2420;
  --muted: #5C6862;
  --accent: #0B7285;
  --accent-ink: #095E6E;
  --line: #DDE2DD;
  --code-bg: #EDF0EC;
  --code-ink: #2A332E;
  --quote-bg: #EEF3F1;
  --thead-bg: #EDF0EC;
  --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131715;
    --ink: #E4E8E4;
    --muted: #9AA69F;
    --accent: #57C4D4;
    --accent-ink: #7BD2DF;
    --line: #2A312C;
    --code-bg: #1B211D;
    --code-ink: #CBD4CD;
    --quote-bg: #182019;
    --thead-bg: #1B211D;
  }
}
:root[data-theme="dark"] {
  --paper: #131715;
  --ink: #E4E8E4;
  --muted: #9AA69F;
  --accent: #57C4D4;
  --accent-ink: #7BD2DF;
  --line: #2A312C;
  --code-bg: #1B211D;
  --code-ink: #CBD4CD;
  --quote-bg: #182019;
  --thead-bg: #1B211D;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.0625rem;
  line-height: 1.7;
}
a { color: var(--accent-ink); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, .toc a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

.frame { display: flex; justify-content: center; gap: 3rem; padding: 0 1.25rem; }
.toc {
  display: none;
  position: sticky; top: 0; align-self: flex-start;
  max-height: 100vh; overflow-y: auto;
  width: 250px; flex: none;
  padding: 2.5rem 0 2rem;
  font-family: var(--sans); font-size: 0.8125rem; line-height: 1.45;
}
.toc .toc-head {
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 0.6875rem; color: var(--muted); margin: 0 0 0.75rem;
}
.toc a { display: block; color: var(--muted); text-decoration: none; padding: 0.22rem 0 0.22rem 0.75rem; border-left: 2px solid var(--line); }
.toc a.toc-2 { color: var(--ink); font-weight: 600; margin-top: 0.45rem; }
.toc a:hover { color: var(--accent-ink); border-left-color: var(--accent); }
.toc code { font-family: var(--mono); font-size: 0.9em; background: none; padding: 0; }
@media (min-width: 1120px) { .toc { display: block; } }

main { min-width: 0; max-width: 46rem; padding-bottom: 5rem; }

header.masthead { padding: 3rem 0 0.5rem; }
.eyebrow {
  font-family: var(--sans); font-size: 0.6875rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent-ink);
  margin: 0 0 0.9rem;
}
h1 {
  font-family: var(--sans); font-weight: 700; font-size: 2.1rem;
  line-height: 1.15; letter-spacing: -0.015em; text-wrap: balance; margin: 0 0 0.6rem;
}
.masthead .sub { color: var(--muted); font-size: 1rem; margin: 0 0 1rem; max-width: 60ch; }
.masthead .meta {
  font-family: var(--mono); font-size: 0.72rem; color: var(--muted);
  border-top: 1px solid var(--line); padding-top: 0.8rem; margin-top: 1.4rem;
}

h2 {
  font-family: var(--sans); font-weight: 700; font-size: 1.45rem; line-height: 1.25;
  letter-spacing: -0.01em; text-wrap: balance;
  margin: 3rem 0 1rem; padding-top: 1.6rem; border-top: 1px solid var(--line);
}
h3 {
  font-family: var(--sans); font-weight: 600; font-size: 1.08rem; line-height: 1.3;
  text-wrap: balance; margin: 2.2rem 0 0.7rem;
}
h4 {
  font-family: var(--sans); font-weight: 600; font-size: 0.8125rem; line-height: 1.3;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent-ink);
  margin: 2rem 0 0.6rem;
}
h2 code, h3 code, h4 code { font-size: 0.92em; background: none; padding: 0; }
p { margin: 0 0 1rem; }
strong { font-weight: 600; }
ul, ol { margin: 0 0 1rem; padding-left: 1.4rem; }
li { margin-bottom: 0.35rem; }
hr { border: none; border-top: 1px solid var(--line); margin: 2.5rem 0; }

code {
  font-family: var(--mono); font-size: 0.82em;
  background: var(--code-bg); color: var(--code-ink);
  padding: 0.1em 0.35em; border-radius: 3px;
}
.code-wrap { overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1.1rem; }
.code-wrap pre { margin: 0; padding: 0.9rem 1.1rem; }
.code-wrap code { background: none; padding: 0; font-size: 0.78rem; line-height: 1.55; color: var(--code-ink); }

blockquote {
  margin: 0 0 1.1rem; padding: 0.9rem 1.2rem;
  background: var(--quote-bg); border-left: 3px solid var(--accent);
  border-radius: 0 6px 6px 0;
}
blockquote p:last-child { margin-bottom: 0; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1.1rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; line-height: 1.5; }
thead th {
  font-family: var(--sans); font-size: 0.72rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em; text-align: left;
  background: var(--thead-bg); color: var(--muted);
  padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line);
}
tbody td { padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
td code, th code { white-space: nowrap; }

.diagram { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; margin: 0 0 1.1rem; padding: 0.6rem; }
.diagram .mermaid { margin: 0; }

@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="frame">
{{TOC}}
<main>
<header class="masthead">
<p class="eyebrow">{{EYEBROW}}</p>
<h1>{{H1}}</h1>
<p class="sub">{{SUB}}</p>
<p class="meta">{{META}}</p>
</header>
{{BODY}}
</main>
</div>
